# Builds the transcripts of the recordings in samples/ (scripts/transcript.py), which replays each one first, and
# deploys them to Pages from main. Pages cannot serve a private repository, so there the site is built and uploaded but
# not deployed. The build and upload skip until samples/ holds a recording. No model or Jev call runs here.
name: Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --locked
      - if: hashFiles('samples/*.json.gz') != ''
        run: uv run python scripts/transcript.py samples site
      - if: hashFiles('samples/*.json.gz') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
